[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jax-pwa"
version = "0.1.0.dev0"
description = "Dalitz-plot amplitude fitter with JAX likelihoods"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan B. S. Leite" }]
dependencies = [
  "iminuit>=2.32",
  "jax>=0.4.35",
  "matplotlib>=3.9",
  "mplhep>=0.4",
  "numpy>=2.0",
  "pandas>=2.0",
  "particle>=1.0.0",
  "uproot>=5.6",
]

[project.optional-dependencies]
sympy = ["sympy>=1.14"]
splot = ["sweights"]
cuda12 = ["jax[cuda12]>=0.4.35"]
cuda13 = ["jax[cuda13]>=0.4.35"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["jax-pwa[test]", "ruff>=0.9"]
docs = ["sphinx>=7.3", "myst-parser>=3.0", "furo>=2024.1", "sphinx-design>=0.6", "sphinx-copybutton>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/jaxpwa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
