# Read the Docs build: Sphinx + MyST over docs/*.md, API pages generated from
# docs/catalog.md and the public docstrings (see docs/conf.py).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
